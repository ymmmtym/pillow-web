[project]
name = "pillow-web"
version = "0.1.0"
description = "A simple Flask API for generating images with Pillow"
authors = [
    { name = "ymmmtym", email = "26668352+ymmmtym@users.noreply.github.com" }
]
dependencies = [
    "pillow>=9.5.0",
    "flask>=2.3.2",
    "flask-limiter>=3.3.0",
    "requests>=2.32.4",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = [
    "uv.lock",
    ".python-version",
]
